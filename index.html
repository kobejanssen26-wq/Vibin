<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3155ff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>VIBIN — Vind je vibe. Maak een plan.</title>
    <meta
      name="description"
      content="VIBIN helpt groepen beslissen wat ze samen doen. Swipe op activiteiten, match op wat iedereen wil, vind een moment dat past en maak het plan."
    />
    <link rel="canonical" href="https://vibin.be/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VIBIN" />
    <meta property="og:url" content="https://vibin.be/" />
    <meta property="og:title" content="VIBIN — Vind je vibe. Maak een plan." />
    <meta
      property="og:description"
      content="Swipe met je groep op activiteiten. Het is pas een match als iedereen meedoet. Vind daarna een moment en maak het plan."
    />
    <meta property="og:image" content="https://vibin.be/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VIBIN — Vind je vibe. Maak een plan." />
    <meta
      name="twitter:description"
      content="Swipe met je groep op activiteiten. Het is pas een match als iedereen meedoet."
    />
    <meta name="twitter:image" content="https://vibin.be/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* First-paint shell so there is no white flash before React mounts */
      #vibin-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f8fc;
      }
      #vibin-boot svg { width: 44px; height: 44px; animation: vb 1.1s ease-in-out infinite; }
      @keyframes vb { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @media (prefers-reduced-motion: reduce) { #vibin-boot svg { animation: none } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="vibin-boot">
      <svg viewBox="0 0 48 48" aria-label="VIBIN">
        <rect width="48" height="48" rx="12" fill="#101426" />
        <line x1="10" y1="8" x2="24" y2="40" stroke="#3155ff" stroke-width="9" stroke-linecap="round" />
        <line x1="38" y1="8" x2="24" y2="40" stroke="#b8f23d" stroke-width="9" stroke-linecap="round" />
        <circle cx="24" cy="40" r="4.2" fill="#f7f8fc" />
      </svg>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
