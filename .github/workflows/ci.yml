name: CI

on:
  push:
    branches: [main, v1.2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

      # Boot the built Worker and run the black-box suites against a fresh DB.
      # The two values below are THROWAWAY CI-ONLY test values (the encryption
      # key is base64 of the literal "test-ci-32-byte-key-do-not-ship!"). They
      # exist so the suite runs on a fresh fork with no configured secrets and
      # are worthless outside this ephemeral job — real keys go to
      # `wrangler secret put` / GitHub Actions secrets, never a file.
      - name: Integration tests
        run: |
          cat > .dev.vars <<'EOF'
          APP_ENV=development
          APP_URL=http://localhost:8787
          ENCRYPTION_KEY=dGVzdC1jaS0zMi1ieXRlLWtleS1kby1ub3Qtc2hpcCE=
          OWNER_RECOVERY_SECRET=ci-only-owner-recovery-secret
          EOF
          npx wrangler d1 migrations apply vibin-db --local
          npm run db:seed:build
          npx wrangler d1 execute vibin-db --local --file=./seed/seed.sql
          npx wrangler dev --port 8787 --local &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8787/api/health && break
            sleep 2
          done
          BASE=http://127.0.0.1:8787 node tests/admin-auth.mjs
          # both admin suites do their own first-run owner setup — reset owner
          # state between them so each starts from a clean slate
          npx wrangler d1 execute vibin-db --local --command "DELETE FROM admin_sessions; DELETE FROM admin_totp; DELETE FROM admin_recovery_codes; DELETE FROM credentials; DELETE FROM credential_access_log; DELETE FROM feature_flags; DELETE FROM system_settings WHERE key IN ('owner_setup_completed_at','maintenance_mode','maintenance_message'); UPDATE users SET role='user' WHERE role='owner';"
          BASE=http://127.0.0.1:8787 node tests/admin-security.mjs
          BASE=http://127.0.0.1:8787 node tests/integration.mjs

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply vibin-db --remote

      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
